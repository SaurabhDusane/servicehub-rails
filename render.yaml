services:
  - type: web
    name: servicehub-web
    env: ruby
    plan: starter
    buildCommand: "bundle install && bin/rails assets:precompile && bin/rails db:migrate"
    startCommand: "bin/rails server -b 0.0.0.0 -p $PORT"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "1"
      - key: RAILS_LOG_TO_STDOUT
        value: "1"
      - key: DATABASE_URL
        fromDatabase: { name: servicehub-db, property: connectionString }
      - key: REDIS_URL
        fromService: { name: servicehub-redis, type: redis, property: connectionString }
      - key: RAILS_MASTER_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false

  - type: worker
    name: servicehub-sidekiq
    env: ruby
    plan: starter
    buildCommand: "bundle install"
    startCommand: "bundle exec sidekiq -C config/sidekiq.yml"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: servicehub-db, property: connectionString }
      - key: REDIS_URL
        fromService: { name: servicehub-redis, type: redis, property: connectionString }
      - key: RAILS_MASTER_KEY
        sync: false

databases:
  - name: servicehub-db
    plan: starter

  - name: servicehub-redis
    type: redis
    plan: starter
